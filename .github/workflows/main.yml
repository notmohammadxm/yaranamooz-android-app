name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Universal APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate signing keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/yaraniha.keystore" \
            -alias yaraniha \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass yaraniha123 \
            -keypass yaraniha123 \
            -dname "CN=Yaraniha, OU=Dev, O=Yaraniha, L=Tehran, S=Tehran, C=IR"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "yaraniha.png" ]; then
            echo "ERROR: yaraniha.png was not found in repository root."
            exit 1
          fi

          mkdir -p app/src/main/java/com/mohammadkhxm/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle/wrapper

          cp yaraniha.png app/src/main/res/drawable/yaraniha.png

          # =========================================================
          # AndroidManifest.xml  (minimal, no API-31+/33+ attributes)
          # =========================================================
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.camera.autofocus"
                  android:required="false" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/yaraniha"
                  android:label="Yaraniha"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF

          # =========================================================
          # MainActivity.kt  (API-23 safe, no API-24+ calls without guards)
          # =========================================================
          cat > app/src/main/java/com/mohammadkhxm/browser/MainActivity.kt <<'EOF'
          package com.mohammadkhxm.browser

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.webkit.CookieManager
          import android.webkit.DownloadListener
          import android.webkit.URLUtil
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private var webView: WebView? = null
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              companion object {
                  private const val WEBSITE_URL = "https://app.yaran.info"
                  private const val FILE_CHOOSER_REQUEST_CODE = 1001
                  private const val PERMISSION_REQUEST_CODE = 2001
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.webView)
                  setupWebView()
                  setupBackNavigation()
                  requestInitialPermissions()

                  if (savedInstanceState == null) {
                      webView?.loadUrl(WEBSITE_URL)
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView() {
                  val wv = webView ?: return
                  val settings = wv.settings

                  settings.javaScriptEnabled = true
                  settings.javaScriptCanOpenWindowsAutomatically = false
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true
                  settings.loadsImagesAutomatically = true
                  settings.useWideViewPort = true
                  settings.loadWithOverviewMode = true
                  settings.cacheMode = WebSettings.LOAD_DEFAULT
                  settings.allowFileAccess = false
                  settings.allowContentAccess = false
                  settings.allowFileAccessFromFileURLs = false
                  settings.allowUniversalAccessFromFileURLs = false
                  settings.mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW

                  wv.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {
                          if (url.isNullOrBlank()) return false
                          view?.loadUrl(url)
                          return true
                      }

                      override fun onReceivedSslError(
                          view: WebView?,
                          handler: android.webkit.SslErrorHandler?,
                          error: android.net.http.SslError?
                      ) {
                          handler?.cancel()
                          Toast.makeText(this@MainActivity, "SSL error", Toast.LENGTH_SHORT).show()
                      }
                  }

                  wv.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePath: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = filePath

                          val intent = try {
                              fileChooserParams?.createIntent() ?: Intent(Intent.ACTION_GET_CONTENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "*/*"
                              }
                          } catch (e: Exception) {
                              Intent(Intent.ACTION_GET_CONTENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "*/*"
                              }
                          }

                          return try {
                              startActivityForResult(
                                  Intent.createChooser(intent, "Select file"),
                                  FILE_CHOOSER_REQUEST_CODE
                              )
                              true
                          } catch (e: Exception) {
                              filePathCallback = null
                              false
                          }
                      }
                  }

                  wv.setDownloadListener(DownloadListener { url, userAgent, contentDisposition, mimeType, _ ->
                      try {
                          val uri = Uri.parse(url)
                          val cookies = CookieManager.getInstance().getCookie(url)
                          val fileName = URLUtil.guessFileName(url, contentDisposition, mimeType)
                          val request = DownloadManager.Request(uri)

                          request.setTitle(fileName)
                          request.setDescription("Downloading...")
                          if (!mimeType.isNullOrBlank()) request.setMimeType(mimeType)
                          request.setNotificationVisibility(
                              DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                          )
                          request.setAllowedOverRoaming(true)

                          // setAllowedOverMetered was added in API 24
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              request.setAllowedOverMetered(true)
                          }

                          if (!userAgent.isNullOrBlank()) request.addRequestHeader("User-Agent", userAgent)
                          if (!cookies.isNullOrBlank()) request.addRequestHeader("Cookie", cookies)
                          request.addRequestHeader("Referer", WEBSITE_URL)
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName)

                          val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                          dm.enqueue(request)
                          Toast.makeText(this, "Download started: $fileName", Toast.LENGTH_SHORT).show()
                      } catch (e: Exception) {
                          Toast.makeText(this, "Download error", Toast.LENGTH_SHORT).show()
                      }
                  })
              }

              private fun setupBackNavigation() {
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          val wv = webView
                          if (wv != null && wv.canGoBack()) {
                              wv.goBack()
                          } else {
                              isEnabled = false
                              onBackPressedDispatcher.onBackPressed()
                          }
                      }
                  })
              }

              private fun requestInitialPermissions() {
                  val permissions = mutableListOf<String>()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                      != PackageManager.PERMISSION_GRANTED) {
                      permissions.add(Manifest.permission.CAMERA)
                  }

                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                      != PackageManager.PERMISSION_GRANTED) {
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE)
                      != PackageManager.PERMISSION_GRANTED) {
                      permissions.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                  }

                  if (permissions.isNotEmpty()) {
                      ActivityCompat.requestPermissions(
                          this, permissions.toTypedArray(), PERMISSION_REQUEST_CODE
                      )
                  }
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != FILE_CHOOSER_REQUEST_CODE) return

                  val callback = filePathCallback
                  filePathCallback = null
                  if (callback == null) return

                  if (resultCode != Activity.RESULT_OK) {
                      callback.onReceiveValue(null)
                      return
                  }

                  val results: Array<Uri>? = when {
                      data?.clipData != null -> {
                          val clipData = data.clipData!!
                          Array(clipData.itemCount) { i -> clipData.getItemAt(i).uri }
                      }
                      data?.data != null -> arrayOf(data.data!!)
                      else -> null
                  }

                  callback.onReceiveValue(results)
              }

              override fun onDestroy() {
                  filePathCallback?.onReceiveValue(null)
                  filePathCallback = null
                  webView?.let {
                      it.stopLoading()
                      it.webChromeClient = null
                      it.destroy()
                  }
                  webView = null
                  super.onDestroy()
              }
          }
          EOF

          # =========================================================
          # Layout
          # =========================================================
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </FrameLayout>
          EOF

          # =========================================================
          # Themes (light + dark)
          # =========================================================
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values-night/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          # =========================================================
          # Root build.gradle
          # =========================================================
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # =========================================================
          # App build.gradle (signed release, v1+v2+v3 signatures)
          # =========================================================
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mohammadkhxm.browser'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.mohammadkhxm.browser'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
                  vectorDrawables.useSupportLibrary = true
              }

              signingConfigs {
                  release {
                      storeFile file("../yaraniha.keystore")
                      storePassword "yaraniha123"
                      keyAlias "yaraniha"
                      keyPassword "yaraniha123"
                      // V1 is REQUIRED for Android 6 (API 23)
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                      debuggable false
                  }
                  debug {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                      debuggable false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.9.0'
          }
          EOF

          # =========================================================
          # settings.gradle
          # =========================================================
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Yaraniha'
          include ':app'
          EOF

          # =========================================================
          # gradle.properties
          # =========================================================
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.enableJetifier=false
          kotlin.code.style=official
          EOF

          # =========================================================
          # Gradle wrapper
          # =========================================================
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

          cat > gradlew <<'EOF'
          #!/bin/sh
          APP_HOME=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec java \
            -cp "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
          EOF
          chmod +x gradlew

          echo "Generated Android project."

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signatures (v1 + v2)
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "=== APK info ==="
          ls -lh "$APK"

          echo
          echo "=== Badging ==="
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" \
            | grep -E "package:|sdkVersion:|targetSdkVersion:|application-label:" || true

          echo
          echo "=== Signature verification ==="
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaraniha-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
