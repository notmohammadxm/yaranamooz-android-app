name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Multi‑ABI APKs
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore signing keystore from secret
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/yaraniha.keystore"
          ls -lh "$GITHUB_WORKSPACE/yaraniha.keystore"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "yaraniha.png" ]; then
            echo "ERROR: yaraniha.png was not found in repository root."
            exit 1
          fi

          mkdir -p app/src/main/java/com/mohammadkhxm/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle/wrapper

          # -----------------------------------------------------------------
          # Dummy native libs — this is what forces AGP to produce real
          # per-ABI split APKs.  Without at least one .so per ABI, the
          # splits.abi block is silently ignored.
          # -----------------------------------------------------------------
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86

          # Minimal valid ELF headers (64-bit for arm64, 32-bit for the rest).
          # AGP will not strip them because of keepDebugSymbols below.
          printf '\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x03\x00\xb7\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x40\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x40\x00\x38\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00' > app/src/main/jniLibs/arm64-v8a/libyaraniha_abi.so

          printf '\x7fELF\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x03\x00\x28\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x34\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x34\x00\x20\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00' > app/src/main/jniLibs/armeabi-v7a/libyaraniha_abi.so

          printf '\x7fELF\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x03\x00\x03\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x34\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x34\x00\x20\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00' > app/src/main/jniLibs/x86/libyaraniha_abi.so

          cp yaraniha.png app/src/main/res/drawable/yaraniha.png

          # =========================================================
          # AndroidManifest.xml
          # =========================================================
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.camera.autofocus"
                  android:required="false" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/yaraniha"
                  android:label="Yaraniha"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF

          # =========================================================
          # MainActivity.kt
          # =========================================================
          cat > app/src/main/java/com/mohammadkhxm/browser/MainActivity.kt <<'EOF'
          package com.mohammadkhxm.browser

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.webkit.CookieManager
          import android.webkit.DownloadListener
          import android.webkit.URLUtil
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private var webView: WebView? = null
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              companion object {
                  private const val WEBSITE_URL = "https://app.yaran.info"
                  private const val FILE_CHOOSER_REQUEST_CODE = 1001
                  private const val PERMISSION_REQUEST_CODE = 2001
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.webView)
                  setupWebView()
                  setupBackNavigation()
                  requestInitialPermissions()

                  if (savedInstanceState == null) {
                      webView?.loadUrl(WEBSITE_URL)
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView() {
                  val wv = webView ?: return
                  val settings = wv.settings

                  settings.javaScriptEnabled = true
                  settings.javaScriptCanOpenWindowsAutomatically = false
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true
                  settings.loadsImagesAutomatically = true
                  settings.useWideViewPort = true
                  settings.loadWithOverviewMode = true
                  settings.cacheMode = WebSettings.LOAD_DEFAULT
                  settings.allowFileAccess = false
                  settings.allowContentAccess = false
                  settings.allowFileAccessFromFileURLs = false
                  settings.allowUniversalAccessFromFileURLs = false
                  settings.mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW

                  wv.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {
                          if (url.isNullOrBlank()) return false
                          view?.loadUrl(url)
                          return true
                      }

                      override fun onReceivedSslError(
                          view: WebView?,
                          handler: android.webkit.SslErrorHandler?,
                          error: android.net.http.SslError?
                      ) {
                          handler?.cancel()
                          Toast.makeText(this@MainActivity, "SSL error", Toast.LENGTH_SHORT).show()
                      }
                  }

                  wv.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePath: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = filePath

                          val intent = try {
                              fileChooserParams?.createIntent() ?: Intent(Intent.ACTION_GET_CONTENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "*/*"
                              }
                          } catch (e: Exception) {
                              Intent(Intent.ACTION_GET_CONTENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "*/*"
                              }
                          }

                          return try {
                              startActivityForResult(
                                  Intent.createChooser(intent, "Select file"),
                                  FILE_CHOOSER_REQUEST_CODE
                              )
                              true
                          } catch (e: Exception) {
                              filePathCallback = null
                              false
                          }
                      }
                  }

                  wv.setDownloadListener(DownloadListener { url, userAgent, contentDisposition, mimeType, _ ->
                      try {
                          val uri = Uri.parse(url)
                          val cookies = CookieManager.getInstance().getCookie(url)
                          val fileName = URLUtil.guessFileName(url, contentDisposition, mimeType)
                          val request = DownloadManager.Request(uri)

                          request.setTitle(fileName)
                          request.setDescription("Downloading...")
                          if (!mimeType.isNullOrBlank()) request.setMimeType(mimeType)
                          request.setNotificationVisibility(
                              DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                          )
                          request.setAllowedOverRoaming(true)

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              request.setAllowedOverMetered(true)
                          }

                          if (!userAgent.isNullOrBlank()) request.addRequestHeader("User-Agent", userAgent)
                          if (!cookies.isNullOrBlank()) request.addRequestHeader("Cookie", cookies)
                          request.addRequestHeader("Referer", WEBSITE_URL)
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName)

                          val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                          dm.enqueue(request)
                          Toast.makeText(this, "Download started: $fileName", Toast.LENGTH_SHORT).show()
                      } catch (e: Exception) {
                          Toast.makeText(this, "Download error", Toast.LENGTH_SHORT).show()
                      }
                  })
              }

              private fun setupBackNavigation() {
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          val wv = webView
                          if (wv != null && wv.canGoBack()) {
                              wv.goBack()
                          } else {
                              isEnabled = false
                              onBackPressedDispatcher.onBackPressed()
                          }
                      }
                  })
              }

              private fun requestInitialPermissions() {
                  val permissions = mutableListOf<String>()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                      != PackageManager.PERMISSION_GRANTED) {
                      permissions.add(Manifest.permission.CAMERA)
                  }

                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                      != PackageManager.PERMISSION_GRANTED) {
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE)
                      != PackageManager.PERMISSION_GRANTED) {
                      permissions.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                  }

                  if (permissions.isNotEmpty()) {
                      ActivityCompat.requestPermissions(
                          this, permissions.toTypedArray(), PERMISSION_REQUEST_CODE
                      )
                  }
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != FILE_CHOOSER_REQUEST_CODE) return

                  val callback = filePathCallback
                  filePathCallback = null
                  if (callback == null) return

                  if (resultCode != Activity.RESULT_OK) {
                      callback.onReceiveValue(null)
                      return
                  }

                  val results: Array<Uri>? = when {
                      data?.clipData != null -> {
                          val clipData = data.clipData!!
                          Array(clipData.itemCount) { i -> clipData.getItemAt(i).uri }
                      }
                      data?.data != null -> arrayOf(data.data!!)
                      else -> null
                  }

                  callback.onReceiveValue(results)
              }

              override fun onDestroy() {
                  filePathCallback?.onReceiveValue(null)
                  filePathCallback = null
                  webView?.let {
                      it.stopLoading()
                      it.webChromeClient = null
                      it.destroy()
                  }
                  webView = null
                  super.onDestroy()
              }
          }
          EOF

          # =========================================================
          # Layout
          # =========================================================
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </FrameLayout>
          EOF

          # =========================================================
          # Themes
          # =========================================================
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values-night/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          # =========================================================
          # Root build.gradle
          # =========================================================
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # =========================================================
          # App build.gradle
          # =========================================================
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mohammadkhxm.browser'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.mohammadkhxm.browser'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
                  vectorDrawables.useSupportLibrary = true
              }

              // ---------------------------------------------------
              // ABI splits — will now actually produce 4 APKs because
              // jniLibs/<abi>/libyaraniha_abi.so exists for each ABI.
              // ---------------------------------------------------
              splits {
                  abi {
                      reset()
                      include 'arm64-v8a', 'armeabi-v7a', 'x86'
                      universalApk true
                  }
              }

              signingConfigs {
                  release {
                      storeFile file("../yaraniha.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                      keyAlias System.getenv("KEY_ALIAS") ?: ""
                      keyPassword System.getenv("KEY_PASSWORD") ?: ""
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                      debuggable false
                  }
                  debug {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                      debuggable false
                  }
              }

              // Prevent AGP from stripping our placeholder .so files.
              packaging {
                  jniLibs {
                      keepDebugSymbols += "**/*.so"
                  }
                  resources {
                      excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module']
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.9.0'
          }
          EOF

          # =========================================================
          # settings.gradle
          # =========================================================
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Yaraniha'
          include ':app'
          EOF

          # =========================================================
          # gradle.properties
          # =========================================================
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.enableJetifier=false
          kotlin.code.style=official
          EOF

          # =========================================================
          # Gradle wrapper
          # =========================================================
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

          cat > gradlew <<'EOF'
          #!/bin/sh
          APP_HOME=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec java \
            -cp "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
          EOF
          chmod +x gradlew

          echo "Generated Android project with dummy native libs."

      - name: Build Release APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"

          echo "=== APKs found ==="
          find "$APK_DIR" -maxdepth 1 -name "*.apk" -exec ls -lh {} \;

          APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | wc -l)
          echo "Total APKs: $APK_COUNT"

          if [ "$APK_COUNT" -lt 4 ]; then
            echo "WARNING: Expected at least 4 APKs (3 ABI + universal), got $APK_COUNT"
          fi

          echo
          echo "=== Signature verification ==="
          for apk in "$APK_DIR"/*.apk; do
            echo "--- $(basename "$apk") ---"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk" 2>&1 | \
              grep -E "Verified using|Number of signers" || true
            echo
          done

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: yaraniha-multi-abi-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
