name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_VERSION: "17"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory not found:"
            echo "$ANDROID_HOME"
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found:"
            echo "$SDKMANAGER"
            echo
            echo "Available cmdline-tools:"
            find "$ANDROID_HOME/cmdline-tools" \
              -maxdepth 3 \
              -type f \
              -name sdkmanager \
              2>/dev/null || true
            exit 1
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo
          echo "Android SDK:"
          "$SDKMANAGER" --list_installed

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking custom icon..."

          if [ ! -f "yaraniha.png" ]; then
            echo "ERROR: yaraniha.png was not found in repository root."
            echo "Expected file:"
            echo "./yaraniha.png"
            exit 1
          fi

          echo "Custom icon:"
          file yaraniha.png
          ls -lh yaraniha.png

          mkdir -p app/src/main/java/com/mohammadkhxm/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle/wrapper

          # =========================================================
          # Custom app icon
          # =========================================================

          cp yaraniha.png app/src/main/res/drawable/yaraniha.png

          # =========================================================
          # AndroidManifest.xml
          # =========================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Internet -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <!-- Camera -->
              <uses-permission android:name="android.permission.CAMERA" />

              <!-- Notifications -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <!-- Old Android storage -->
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/yaraniha"
                  android:label="Yaran Amooz"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:hardwareAccelerated="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # =========================================================
          # MainActivity.kt
          # =========================================================

          cat > app/src/main/java/com/mohammadkhxm/browser/MainActivity.kt <<'EOF'
          package com.mohammadkhxm.browser

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.view.KeyEvent
          import android.webkit.CookieManager
          import android.webkit.DownloadListener
          import android.webkit.URLUtil
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView

              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              companion object {
                  private const val WEBSITE_URL =
                      "https://app.yaranamooz.ir"

                  private const val FILE_CHOOSER_REQUEST_CODE = 1001
                  private const val PERMISSION_REQUEST_CODE = 2001
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.webView)

                  setupWebView()

                  requestInitialPermissions()

                  webView.loadUrl(WEBSITE_URL)
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView() {

                  val settings = webView.settings

                  // JavaScript
                  settings.javaScriptEnabled = true

                  // Storage
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true

                  // Images / viewport
                  settings.loadsImagesAutomatically = true
                  settings.useWideViewPort = true
                  settings.loadWithOverviewMode = true

                  // Cache
                  settings.cacheMode = WebSettings.LOAD_DEFAULT

                  // Mixed content compatibility
                  settings.mixedContentMode =
                      WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE

                  // Hardware acceleration
                  webView.setLayerType(
                      WebView.LAYER_TYPE_HARDWARE,
                      null
                  )

                  // =================================================
                  // WebView navigation
                  // =================================================

                  webView.webViewClient = object : WebViewClient() {

                      override fun shouldOverrideUrlLoading(
                          view: WebView?,
                          url: String?
                      ): Boolean {

                          if (url.isNullOrBlank()) {
                              return false
                          }

                          view?.loadUrl(url)

                          return true
                      }
                  }

                  // =================================================
                  // File chooser / JavaScript
                  // =================================================

                  webView.webChromeClient = object : WebChromeClient() {

                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePath: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {

                          // Cancel previous request
                          this@MainActivity
                              .filePathCallback
                              ?.onReceiveValue(null)

                          this@MainActivity.filePathCallback =
                              filePath

                          val intent = try {

                              fileChooserParams?.createIntent()
                                  ?: Intent(
                                      Intent.ACTION_OPEN_DOCUMENT
                                  ).apply {
                                      addCategory(
                                          Intent.CATEGORY_OPENABLE
                                      )
                                      type = "*/*"
                                  }

                          } catch (e: Exception) {

                              Intent(
                                  Intent.ACTION_OPEN_DOCUMENT
                              ).apply {
                                  addCategory(
                                      Intent.CATEGORY_OPENABLE
                                  )
                                  type = "*/*"
                              }
                          }

                          return try {

                              startActivityForResult(
                                  Intent.createChooser(
                                      intent,
                                      "انتخاب فایل"
                                  ),
                                  FILE_CHOOSER_REQUEST_CODE
                              )

                              true

                          } catch (e: Exception) {

                              this@MainActivity
                                  .filePathCallback = null

                              Toast.makeText(
                                  this@MainActivity,
                                  "انتخاب فایل امکان‌پذیر نیست",
                                  Toast.LENGTH_SHORT
                              ).show()

                              false
                          }
                      }
                  }

                  // =================================================
                  // Download support
                  // =================================================

                  webView.setDownloadListener(
                      DownloadListener {
                          url,
                          userAgent,
                          contentDisposition,
                          mimeType,
                          _ ->

                          try {

                              val uri = Uri.parse(url)

                              val cookieManager =
                                  CookieManager.getInstance()

                              val cookies =
                                  cookieManager.getCookie(url)

                              val fileName =
                                  URLUtil.guessFileName(
                                      url,
                                      contentDisposition,
                                      mimeType
                                  )

                              val request =
                                  DownloadManager.Request(uri)

                              request.setTitle(fileName)

                              request.setDescription(
                                  "در حال دانلود فایل..."
                              )

                              if (!mimeType.isNullOrBlank()) {
                                  request.setMimeType(mimeType)
                              }

                              request.setNotificationVisibility(
                                  DownloadManager
                                      .Request
                                      .VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                              )

                              request.setAllowedOverMetered(true)
                              request.setAllowedOverRoaming(true)

                              // WebView User-Agent
                              if (!userAgent.isNullOrBlank()) {
                                  request.addRequestHeader(
                                      "User-Agent",
                                      userAgent
                                  )
                              }

                              // WebView cookies
                              if (!cookies.isNullOrBlank()) {
                                  request.addRequestHeader(
                                      "Cookie",
                                      cookies
                                  )
                              }

                              // Referer
                              request.addRequestHeader(
                                  "Referer",
                                  WEBSITE_URL
                              )

                              // Downloads folder
                              request.setDestinationInExternalPublicDir(
                                  Environment.DIRECTORY_DOWNLOADS,
                                  fileName
                              )

                              val downloadManager =
                                  getSystemService(
                                      Context.DOWNLOAD_SERVICE
                                  ) as DownloadManager

                              downloadManager.enqueue(request)

                              Toast.makeText(
                                  this,
                                  "دانلود شروع شد:\n$fileName",
                                  Toast.LENGTH_LONG
                              ).show()

                          } catch (e: Exception) {

                              Toast.makeText(
                                  this,
                                  "خطا در دانلود فایل",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }
                  )
              }

              // =====================================================
              // Request permissions on first launch
              // =====================================================

              private fun requestInitialPermissions() {

                  val permissions =
                      mutableListOf<String>()

                  // Camera
                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.M &&
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      permissions.add(
                          Manifest.permission.CAMERA
                      )
                  }

                  // Notifications Android 13+
                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.TIRAMISU &&
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.POST_NOTIFICATIONS
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      permissions.add(
                          Manifest.permission.POST_NOTIFICATIONS
                      )
                  }

                  // Storage Android 9 and older
                  if (
                      Build.VERSION.SDK_INT <=
                      Build.VERSION_CODES.P &&
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      permissions.add(
                          Manifest.permission.WRITE_EXTERNAL_STORAGE
                      )
                  }

                  if (permissions.isNotEmpty()) {

                      ActivityCompat.requestPermissions(
                          this,
                          permissions.toTypedArray(),
                          PERMISSION_REQUEST_CODE
                      )
                  }
              }

              // =====================================================
              // File chooser result
              // =====================================================

              @Deprecated("Deprecated in Android API")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode !=
                      FILE_CHOOSER_REQUEST_CODE
                  ) {
                      return
                  }

                  val callback =
                      filePathCallback

                  filePathCallback = null

                  if (callback == null) {
                      return
                  }

                  if (resultCode != Activity.RESULT_OK) {

                      callback.onReceiveValue(null)

                      return
                  }

                  val results: Array<Uri>? =
                      when {

                          // Multiple files
                          data?.clipData != null -> {

                              val clipData =
                                  data.clipData!!

                              Array(
                                  clipData.itemCount
                              ) { index ->

                                  clipData
                                      .getItemAt(index)
                                      .uri
                              }
                          }

                          // One file
                          data?.data != null -> {

                              arrayOf(
                                  data.data!!
                              )
                          }

                          else -> {
                              null
                          }
                      }

                  callback.onReceiveValue(results)
              }

              // =====================================================
              // Back button
              // =====================================================

              override fun onKeyDown(
                  keyCode: Int,
                  event: KeyEvent?
              ): Boolean {

                  if (
                      keyCode ==
                      KeyEvent.KEYCODE_BACK &&
                      ::webView.isInitialized &&
                      webView.canGoBack()
                  ) {

                      webView.goBack()

                      return true
                  }

                  return super.onKeyDown(
                      keyCode,
                      event
                  )
              }

              // =====================================================
              // Cleanup
              // =====================================================

              override fun onDestroy() {

                  if (::webView.isInitialized) {

                      webView.stopLoading()

                      webView.webChromeClient = null

                      // IMPORTANT:
                      // Do NOT set webViewClient = null.
                      // Kotlin WebViewClient property is non-null.

                      webView.destroy()
                  }

                  filePathCallback
                      ?.onReceiveValue(null)

                  filePathCallback = null

                  super.onDestroy()
              }
          }
          EOF

          # =========================================================
          # Layout
          # =========================================================

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </FrameLayout>
          EOF

          # =========================================================
          # Theme
          # =========================================================

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#3F51B5</item>
                  <item name="android:windowNoTitle">true</item>

              </style>

          </resources>
          EOF

          # =========================================================
          # Root build.gradle
          # =========================================================

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # =========================================================
          # App build.gradle
          # =========================================================

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mohammadkhxm.browser'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.mohammadkhxm.browser'
                  minSdk 21
                  targetSdk 34

                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {

                  debug {
                      debuggable true
                  }

                  release {
                      minifyEnabled false

                      proguardFiles(
                          getDefaultProguardFile(
                              'proguard-android-optimize.txt'
                          ),
                          'proguard-rules.pro'
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {

              implementation 'androidx.core:core-ktx:1.12.0'

              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # =========================================================
          # ProGuard
          # =========================================================

          cat > app/proguard-rules.pro <<'EOF'
          # Project-specific ProGuard/R8 rules.
          EOF

          # =========================================================
          # settings.gradle
          # =========================================================

          cat > settings.gradle <<'EOF'
          pluginManagement {

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'YaranAmooz'

          include ':app'
          EOF

          # =========================================================
          # gradle.properties
          # =========================================================

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # =========================================================
          # Gradle wrapper
          # =========================================================

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

          cat > gradlew <<'EOF'
          #!/bin/sh

          APP_HOME=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)

          exec java \
            -cp "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
          EOF

          chmod +x gradlew

          echo
          echo "Generated Android project:"
          find app -maxdepth 10 -type f | sort

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          ./gradlew --version

          echo
          echo "Android SDK:"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo
          echo "Building APK..."

          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaran-amooz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
