name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_VERSION: "17"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory not found:"
            echo "$ANDROID_HOME"
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found:"
            echo "$SDKMANAGER"
            echo
            echo "Available cmdline-tools:"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo
          echo "Android SDK:"
          "$SDKMANAGER" --list_installed

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/mohammadkhxm/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Yaran Amooz"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:hardwareAccelerated="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # ✅ استفاده از Kotlin به جای Java
          cat > app/src/main/java/com/mohammadkhxm/browser/MainActivity.kt <<'EOF'
          package com.mohammadkhxm.browser

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.view.KeyEvent
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView

              companion object {
                  private const val WEBSITE_URL = "https://app.yaranamooz.ir"
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.webView)

                  val settings = webView.settings

                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true

                  settings.loadsImagesAutomatically = true
                  settings.useWideViewPort = true
                  settings.loadWithOverviewMode = true

                  settings.cacheMode = WebSettings.LOAD_DEFAULT

                  webView.setLayerType(
                      WebView.LAYER_TYPE_HARDWARE,
                      null
                  )

                  webView.webViewClient = WebViewClient()

                  webView.webChromeClient = WebChromeClient()

                  webView.loadUrl(WEBSITE_URL)
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK && ::webView.isInitialized) {

                      if (webView.canGoBack()) {
                          webView.goBack()
                          return true
                      }
                  }

                  return super.onKeyDown(keyCode, event)
              }

              override fun onDestroy() {
                  if (::webView.isInitialized) {
                      webView.stopLoading()
                      webView.destroy()
                  }

                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </FrameLayout>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#3F51B5</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#3F51B5"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M30,30h48v48h-48z" />
          </vector>
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mohammadkhxm.browser'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.mohammadkhxm.browser'
                  minSdk 21
                  targetSdk 34

                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      debuggable true
                  }

                  release {
                      minifyEnabled false

                      proguardFiles(
                          getDefaultProguardFile(
                              'proguard-android-optimize.txt'
                          ),
                          'proguard-rules.pro'
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          # Project-specific ProGuard/R8 rules.
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'YaranAmooz'

          include ':app'
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

          cat > gradlew <<'EOF'
          #!/bin/sh
          APP_HOME=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec java \
            -cp "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
          EOF

          chmod +x gradlew

          echo
          echo "Generated project:"
          find app -maxdepth 6 -type f | sort

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          echo "Java:"
          java -version
          echo
          echo "Gradle:"
          ./gradlew --version
          echo
          echo "Android SDK:"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo
          echo "Building APK..."
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaran-amooz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
