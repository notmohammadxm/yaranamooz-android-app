name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_VERSION: "17"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory not found:"
            echo "$ANDROID_HOME"
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found:"
            echo "$SDKMANAGER"
            echo
            echo "Available cmdline-tools:"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo
          echo "Android SDK:"
          "$SDKMANAGER" --list_installed

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/mohammadkhxm/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p gradle/wrapper

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              
              <!-- مجوزهای مورد نیاز برای انتخاب فایل -->
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" 
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Yaran Amooz"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:hardwareAccelerated="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <!-- ارائه‌دهنده فایل برای Android 7+ -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>

          </manifest>
          EOF

          # فایل file_paths.xml برای FileProvider
          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path
                  name="external_files"
                  path="." />
              <external-files-path
                  name="external_files"
                  path="." />
              <cache-path
                  name="cache_files"
                  path="." />
              <external-cache-path
                  name="external_cache_files"
                  path="." />
              <files-path
                  name="files"
                  path="." />
          </paths>
          EOF

          # ✅ MainActivity با پشتیبانی کامل از File Chooser
          cat > app/src/main/java/com/mohammadkhxm/browser/MainActivity.kt <<'EOF'
          package com.mohammadkhxm.browser

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.Manifest
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.core.content.FileProvider
          import java.io.File
          import java.io.IOException
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private var fileUploadCallback: ValueCallback<Array<Uri>>? = null
              private var fileUploadCallbackSingle: ValueCallback<Uri>? = null
              private var cameraPhotoPath: String? = null
              
              companion object {
                  private const val WEBSITE_URL = "https://app.yaranamooz.ir"
                  private const val FILE_CHOOSER_REQUEST_CODE = 1001
                  private const val CAMERA_REQUEST_CODE = 1002
                  private const val PERMISSION_REQUEST_CODE = 1003
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.webView)

                  val settings = webView.settings

                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true

                  settings.loadsImagesAutomatically = true
                  settings.useWideViewPort = true
                  settings.loadWithOverviewMode = true

                  settings.cacheMode = WebSettings.LOAD_DEFAULT
                  
                  // فعال‌سازی انتخاب فایل
                  settings.allowFileAccess = true
                  settings.allowContentAccess = true

                  webView.setLayerType(
                      WebView.LAYER_TYPE_HARDWARE,
                      null
                  )

                  webView.webViewClient = WebViewClient()

                  webView.webChromeClient = object : WebChromeClient() {
                      
                      // برای Android 5.0+
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          fileUploadCallback = filePathCallback
                          return showFileChooser()
                      }
                      
                      // برای Android 4.1 - 4.3
                      @Suppress("DEPRECATION")
                      override fun openFileChooser(
                          uploadMsg: ValueCallback<Uri>?,
                          acceptType: String?,
                          capture: String?
                      ) {
                          fileUploadCallbackSingle = uploadMsg
                          showFileChooser()
                      }
                      
                      // برای Android 4.4
                      @Suppress("DEPRECATION")
                      override fun openFileChooser(uploadMsg: ValueCallback<Uri>?) {
                          fileUploadCallbackSingle = uploadMsg
                          showFileChooser()
                      }
                  }

                  webView.loadUrl(WEBSITE_URL)
              }

              private fun showFileChooser(): Boolean {
                  // بررسی مجوزها
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val permissions = mutableListOf<String>()
                      if (ContextCompat.checkSelfPermission(
                              this,
                              Manifest.permission.READ_EXTERNAL_STORAGE
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {
                          permissions.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                      if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P &&
                          ContextCompat.checkSelfPermission(
                              this,
                              Manifest.permission.WRITE_EXTERNAL_STORAGE
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {
                          permissions.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                      }
                      if (permissions.isNotEmpty()) {
                          ActivityCompat.requestPermissions(
                              this,
                              permissions.toTypedArray(),
                              PERMISSION_REQUEST_CODE
                          )
                          return false
                      }
                  }

                  val intent = Intent(Intent.ACTION_GET_CONTENT)
                  intent.addCategory(Intent.CATEGORY_OPENABLE)
                  intent.type = "*/*"
                  
                  val intentChooser = Intent(Intent.ACTION_CHOOSER)
                  intentChooser.putExtra(Intent.EXTRA_INTENT, intent)
                  intentChooser.putExtra(
                      Intent.EXTRA_TITLE,
                      "انتخاب فایل"
                  )
                  
                  startActivityForResult(
                      intentChooser,
                      FILE_CHOOSER_REQUEST_CODE
                  )
                  
                  return true
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  when (requestCode) {
                      FILE_CHOOSER_REQUEST_CODE -> {
                          if (resultCode == Activity.RESULT_OK) {
                              fileUploadCallback?.let {
                                  val uris = if (data?.clipData != null) {
                                      val count = data.clipData!!.itemCount
                                      Array(count) { i ->
                                          data.clipData!!.getItemAt(i).uri
                                      }
                                  } else {
                                      arrayOf(data?.data)
                                  }
                                  it.onReceiveValue(uris.filterNotNull().toTypedArray())
                                  fileUploadCallback = null
                              }
                              fileUploadCallbackSingle?.let {
                                  it.onReceiveValue(data?.data)
                                  fileUploadCallbackSingle = null
                              }
                          } else {
                              fileUploadCallback?.onReceiveValue(null)
                              fileUploadCallbackSingle?.onReceiveValue(null)
                              fileUploadCallback = null
                              fileUploadCallbackSingle = null
                          }
                      }
                  }

                  override fun onRequestPermissionsResult(
                      requestCode: Int,
                      permissions: Array<out String>,
                      grantResults: IntArray
                  ) {
                      super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                      
                      if (requestCode == PERMISSION_REQUEST_CODE) {
                          if (grantResults.all { it == PackageManager.PERMISSION_GRANTED }) {
                              showFileChooser()
                          } else {
                              Toast.makeText(
                                  this,
                                  "برای انتخاب فایل به مجوز نیاز است",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }
                  }

                  override fun onDestroy() {
                      if (::webView.isInitialized) {
                          webView.stopLoading()
                          webView.destroy()
                      }

                      super.onDestroy()
                  }
              }
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </FrameLayout>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#3F51B5</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#3F51B5"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M30,30h48v48h-48z" />
          </vector>
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mohammadkhxm.browser'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.mohammadkhxm.browser'
                  minSdk 21
                  targetSdk 34

                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      debuggable true
                  }

                  release {
                      minifyEnabled false

                      proguardFiles(
                          getDefaultProguardFile(
                              'proguard-android-optimize.txt'
                          ),
                          'proguard-rules.pro'
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          # Project-specific ProGuard/R8 rules.
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'YaranAmooz'

          include ':app'
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

          cat > gradlew <<'EOF'
          #!/bin/sh
          APP_HOME=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec java \
            -cp "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
          EOF

          chmod +x gradlew

          echo
          echo "Generated project:"
          find app -maxdepth 6 -type f | sort

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          echo "Java:"
          java -version
          echo
          echo "Gradle:"
          ./gradlew --version
          echo
          echo "Android SDK:"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo
          echo "Building APK..."
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaran-amooz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
